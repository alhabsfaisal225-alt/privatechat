<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#075e54">

    <link rel="icon" type="image/png"
          href="/static/synapse-logo%20%282%29.png">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Synapse</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(37, 211, 102, 0.20),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(7, 94, 84, 0.45),
                    transparent 35%
                ),
                #061b17;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;

            overflow-x: hidden;
        }

        .container {
            width: 92%;
            max-width: 420px;
            padding: 25px 0;
        }

        /* LOGO */

        .logo {
            width: 92px;
            height: 92px;

            margin: 0 auto 17px;

            border-radius: 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(255,255,255,0.035);

            border: 1px solid rgba(255,255,255,0.08);

            box-shadow:
                0 15px 40px rgba(0,0,0,0.35),
                inset 0 1px rgba(255,255,255,0.08);

            backdrop-filter: blur(15px);
        }

        .logo img {
            width: 66px;
            height: 66px;

            object-fit: contain;

            display: block;
        }

        /* TITLE */

        .title {
            text-align: center;

            font-size: 32px;

            font-weight: 800;

            letter-spacing: 0.3px;
        }

        .subtitle {
            text-align: center;

            margin-top: 7px;
            margin-bottom: 27px;

            color: #9bbab3;

            font-size: 14px;
        }

        /* LOGIN CARD */

        .card {
            background: rgba(9, 39, 34, 0.88);

            border: 1px solid rgba(255,255,255,0.075);

            border-radius: 25px;

            padding: 28px 23px;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.40),
                inset 0 1px rgba(255,255,255,0.04);

            backdrop-filter: blur(20px);
        }

        .welcome {
            font-size: 21px;

            font-weight: 700;

            margin-bottom: 21px;
        }

        /* INPUTS */

        .input-box {
            margin-bottom: 16px;
        }

        .input-box label {
            display: block;

            font-size: 13px;

            color: #9ebbb5;

            margin-bottom: 8px;
        }

        .input-box input {
            width: 100%;

            padding: 15px 16px;

            border-radius: 14px;

            border: 1px solid #234b43;

            outline: none;

            background: #0b2b26;

            color: white;

            font-size: 15px;

            transition: 0.2s;
        }

        .input-box input:focus {
            border-color: #25d366;

            box-shadow:
                0 0 0 3px rgba(37,211,102,0.10);
        }

        .input-box input::placeholder {
            color: #66817b;
        }

        /* BUTTON */

        .login-btn {
            width: 100%;

            border: none;

            padding: 15px;

            border-radius: 14px;

            background: #25d366;

            color: #052c20;

            font-size: 16px;

            font-weight: 800;

            cursor: pointer;

            margin-top: 7px;

            transition: 0.2s;

            box-shadow:
                0 8px 25px rgba(37,211,102,0.16);
        }

        .login-btn:hover {
            transform: translateY(-1px);

            filter: brightness(1.05);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        /* DIVIDER */

        .divider {
            display: flex;

            align-items: center;

            gap: 12px;

            margin: 23px 0;

            color: #66827c;

            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";

            height: 1px;

            flex: 1;

            background: #24453f;
        }

        /* REGISTER */

        .register {
            text-align: center;

            color: #91aaa5;

            font-size: 14px;
        }

        .register a {
            color: #25d366;

            text-decoration: none;

            font-weight: 700;
        }

        .register a:hover {
            text-decoration: underline;
        }

        /* FOOTER */

        .footer {
            text-align: center;

            margin-top: 22px;

            font-size: 11px;

            color: #56736d;

            letter-spacing: 0.2px;
        }

        /* SMALL PHONES */

        @media (max-width: 420px) {

            .container {
                width: 91%;
            }

            .card {
                padding: 24px 18px;
            }

            .title {
                font-size: 28px;
            }

            .logo {
                width: 84px;
                height: 84px;
            }

            .logo img {
                width: 60px;
                height: 60px;
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="logo">
            <img
                src="/static/synapse-logo%20%282%29.png"
                alt="Synapse Logo"
            >
        </div>

        <h1 class="title">
            Synapse
        </h1>

        <p class="subtitle">
            Connect. Chat. Stay in touch.
        </p>

        <div class="card">

            <div class="welcome">
                Welcome back 👋
            </div>

            <form action="/login" method="POST">

                <div class="input-box">

                    <label>
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="input-box">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <button
                    class="login-btn"
                    type="submit"
                >
                    Sign In
                </button>

            </form>

            <div class="divider">
                OR
            </div>

            <div class="register">

                Don't have an account?

                <a href="/register">
                    Create account
                </a>

            </div>

        </div>

        <div class="footer">
            Synapse • Connect with people
        </div>

    </div>


    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener("load", () => {

                navigator.serviceWorker.register(
                    "/service-worker.js"
                );

            });

        }

    </script>

</body>
</html>
